<?xml version="1.0" encoding="UTF-8"?>
<!-- Top-down floor plan with a magnifying glass for the "Prijavi višak soba" feature -->
<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer apartment walls -->
  <rect x="35" y="45" width="200" height="180" rx="6" fill="#f7f4f0" stroke="#1e3a8a" stroke-width="7"/>
  <!-- Internal room divisions -->
  <line x1="135" y1="45" x2="135" y2="135" stroke="#1e3a8a" stroke-width="5"/>
  <line x1="135" y1="135" x2="135" y2="225" stroke="#1e3a8a" stroke-width="5"/>
  <line x1="35" y1="135" x2="235" y2="135" stroke="#1e3a8a" stroke-width="5"/>
  <line x1="185" y1="45" x2="185" y2="135" stroke="#1e3a8a" stroke-width="5"/>
  <!-- Door gaps (white slots breaking the walls) -->
  <line x1="135" y1="78" x2="135" y2="100" stroke="#f7f4f0" stroke-width="6"/>
  <line x1="75" y1="135" x2="97" y2="135" stroke="#f7f4f0" stroke-width="6"/>
  <line x1="160" y1="135" x2="182" y2="135" stroke="#f7f4f0" stroke-width="6"/>
  <!-- A lone bed in one room: one person, many rooms -->
  <rect x="50" y="60" width="50" height="34" rx="4" fill="none" stroke="#c0392b" stroke-width="3"/>
  <rect x="50" y="60" width="50" height="11" rx="3" fill="#c0392b" opacity="0.5"/>
  <!-- Empty rooms marked with faint question marks -->
  <text x="160" y="105" font-family="Georgia, serif" font-size="42" fill="#1e3a8a" opacity="0.18" text-anchor="middle">?</text>
  <text x="85" y="195" font-family="Georgia, serif" font-size="42" fill="#1e3a8a" opacity="0.18" text-anchor="middle">?</text>
  <text x="185" y="195" font-family="Georgia, serif" font-size="42" fill="#1e3a8a" opacity="0.18" text-anchor="middle">?</text>
  <!-- Magnifying glass over the plan -->
  <circle cx="195" cy="180" r="52" fill="#ffffff" fill-opacity="0.35" stroke="#d4af37" stroke-width="9"/>
  <line x1="232" y1="217" x2="272" y2="257" stroke="#d4af37" stroke-width="14" stroke-linecap="round"/>
  <line x1="232" y1="217" x2="272" y2="257" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round"/>
  <!-- Question mark inside the lens -->
  <text x="195" y="200" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#d4af37" text-anchor="middle">?</text>
  <!-- Lens highlight -->
  <path d="M 168 158 A 38 38 0 0 1 200 138" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
